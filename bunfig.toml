[install]
# Bun 1.3 defaults to the isolated (pnpm-style) linker, which installs several physical
# copies of packages like `expo` and `expo-constants`. React Native native builds accept
# only one copy of any given native module, so `expo-doctor` fails and real builds can
# break in confusing ways. The hoisted linker is what Expo monorepos expect.
linker = "hoisted"
